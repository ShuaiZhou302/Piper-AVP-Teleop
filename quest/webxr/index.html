<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quest Teleop</title>
<style>
  body { margin: 0; background: #14141c; color: #eee; font: 14px/1.4 monospace; }
  #ui { padding: 16px; }
  button { font-size: 20px; padding: 10px 20px; }
  #status { white-space: pre; margin-top: 12px; }
  .ok { color: #6f6; }
  .bad { color: #f66; }
</style>
</head>
<body>
<div id="ui">
  <button id="enter-vr">Enter VR</button>
  <div id="status">connecting to relay...</div>
</div>
<canvas id="gl" style="display:none"></canvas>
<script>
"use strict";

// ---- config -------------------------------------------------------------
// WS endpoint is the same host that served this page, path /ws. See
// webxr_server.py: process_request() serves this file at "/" and lets "/ws"
// fall through to the websocket handshake.
const WS_URL = `wss://${location.host}/ws`;
const SEND_HZ = 50;

// WebXR "oculus-touch"/"generic-trigger-squeeze-thumbstick" input profile
// button indices (stable, documented: immersive-web/webxr-input-profiles).
const BTN_TRIGGER = 0;
const BTN_GRIP = 1;
const BTN_THUMBSTICK = 3;
const BTN_PRIMARY = 4;   // X (left controller) / A (right controller)
const BTN_SECONDARY = 5; // Y (left controller) / B (right controller)

// ---- websocket relay (to webxr_server.py, which forwards to quest_server.py) --
let ws = null;
let wsOpen = false;

function connectWs() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { wsOpen = true; setStatusLine("ws", "OPEN", true); };
  ws.onclose = () => { wsOpen = false; setStatusLine("ws", "CLOSED (retrying)", false); setTimeout(connectWs, 1000); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}
connectWs();

const statusLines = {};
function setStatusLine(key, text, ok) {
  statusLines[key] = { text, ok };
  renderStatus();
}
function renderStatus() {
  const el = document.getElementById("status");
  const order = ["ws", "xr", "head", "left", "right"];
  el.innerHTML = order
    .filter((k) => statusLines[k])
    .map((k) => {
      const { text, ok } = statusLines[k];
      const cls = ok === true ? "ok" : ok === false ? "bad" : "";
      return `<span class="${cls}">${k}: ${text}</span>`;
    })
    .join("\n");
}

// ---- pose helpers ---------------------------------------------------------
// XRRigidTransform.matrix is a column-major Float32Array(16), right-handed,
// +Y up. For a 'local-floor' or 'local' reference space this matches the
// convention documented in ../../avp/Readme.md section 9 (same as AVP/OpenVR:
// +Y up, -Z forward at session start) -- R_QUEST_TO_PIPER in quest_server.py
// applies unchanged to poses captured here.
function poseToWire(rigidTransform) {
  const m = rigidTransform.matrix; // column-major 16 floats
  // protocol.py's pose_to_wire()/wire_to_pose() expect ROW-major 3x3 'rot'
  // (numpy .flatten(order="C") on a row-major 4x4). Transpose here once so
  // the Python side never has to think about column- vs row-major again.
  return {
    pos: [m[12], m[13], m[14]],
    rot: [
      m[0], m[4], m[8],
      m[1], m[5], m[9],
      m[2], m[6], m[10],
    ],
  };
}

function gamepadButtons(gamepad) {
  if (!gamepad) return null;
  const b = gamepad.buttons;
  const get = (i) => (b && b[i]) ? b[i] : { value: 0, pressed: false };
  const trig = get(BTN_TRIGGER);
  const grip = get(BTN_GRIP);
  const primary = get(BTN_PRIMARY);
  const secondary = get(BTN_SECONDARY);
  const stick = get(BTN_THUMBSTICK);
  return {
    trigger: trig.value,
    grip: grip.value,
    grip_pressed: !!grip.pressed,
    trigger_pressed: !!trig.pressed,
    button_ax: !!primary.pressed,
    button_by: !!secondary.pressed,
    stick_pressed: !!stick.pressed,
  };
}

// ---- WebXR session ---------------------------------------------------------
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl", { xrCompatible: true });

async function enterVR() {
  if (!navigator.xr) {
    setStatusLine("xr", "navigator.xr unavailable (not WebXR-capable browser)", false);
    return;
  }
  const supported = await navigator.xr.isSessionSupported("immersive-vr");
  if (!supported) {
    setStatusLine("xr", "immersive-vr not supported", false);
    return;
  }
  const session = await navigator.xr.requestSession("immersive-vr", {
    optionalFeatures: ["local-floor"],
  });
  await gl.makeXRCompatible();
  session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });

  let refSpace;
  try {
    refSpace = await session.requestReferenceSpace("local-floor");
  } catch (e) {
    refSpace = await session.requestReferenceSpace("local");
  }

  setStatusLine("xr", "session active", true);
  session.addEventListener("end", () => setStatusLine("xr", "session ended", false));

  let seq = 0;
  let lastSend = 0;
  const sendPeriodMs = 1000 / SEND_HZ;

  session.requestAnimationFrame(function onFrame(t, frame) {
    session.requestAnimationFrame(onFrame);

    // Mandatory minimal render -- WebXR requires an XRWebGLLayer with frames
    // actually rendered into it for requestAnimationFrame to keep firing.
    const layer = session.renderState.baseLayer;
    gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
    gl.viewport(0, 0, layer.framebufferWidth, layer.framebufferHeight);
    gl.clearColor(0.05, 0.05, 0.08, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    if (t - lastSend < sendPeriodMs) return;
    lastSend = t;

    const headPose = frame.getViewerPose(refSpace);

    let head = { connected: false };
    if (headPose) {
      head = { connected: true, valid: true, tracking_ok: true, ...poseToWire(headPose.transform) };
      setStatusLine("head", "tracked", true);
    } else {
      setStatusLine("head", "no pose", false);
    }

    let left = { connected: false };
    let right = { connected: false };
    for (const src of frame.session.inputSources) {
      if (!src.gripSpace || (src.handedness !== "left" && src.handedness !== "right")) continue;
      const gripPose = frame.getPose(src.gripSpace, refSpace);
      const entry = gripPose
        ? { connected: true, valid: true, tracking_ok: true, ...poseToWire(gripPose.transform), buttons: gamepadButtons(src.gamepad) }
        : { connected: false };
      if (src.handedness === "left") { left = entry; setStatusLine("left", gripPose ? "tracked" : "no pose", !!gripPose); }
      else { right = entry; setStatusLine("right", gripPose ? "tracked" : "no pose", !!gripPose); }
    }

    if (wsOpen) {
      const msg = {
        v: 1,
        seq: seq++,
        t_mono: t / 1000.0,
        t_wall: Date.now() / 1000.0,
        head, left, right,
      };
      try { ws.send(JSON.stringify(msg)); } catch (e) {}
    }
  });
}

document.getElementById("enter-vr").addEventListener("click", () => {
  enterVR().catch((e) => setStatusLine("xr", "enterVR failed: " + e.message, false));
});
</script>
</body>
</html>
